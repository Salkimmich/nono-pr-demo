# Signs the files every agent in this repo reads, with the repo's own identity.
# Keyless: an ephemeral key, a Fulcio certificate bound to this repository,
# workflow and ref, and a Rekor transparency-log entry. nono verifies the
# bundles offline before any agent starts (trust-policy.json lists the files).
name: sign-agent-instructions
on:
  push:
    branches: [main]
    paths:
      - AGENTS.md
      - CLAUDE.md
      - .goosehints
      - .mcp.json
      - .github/workflows/sign-agent-instructions.yml
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
jobs:
  sign:
    runs-on: ubuntu-latest
    env:
      NONO_VERSION: "0.78.0"
    steps:
      - uses: actions/checkout@v4
      - name: Install nono (pinned, checksum verified)
        run: |
          base="https://github.com/nolabs-ai/nono/releases/download/v${NONO_VERSION}"
          tarball="nono-v${NONO_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSLO "$base/$tarball"
          curl -fsSLO "$base/SHA256SUMS.txt"
          grep " ${tarball}\$" SHA256SUMS.txt | sha256sum -c -
          tar xzf "$tarball" nono
          sudo install -m 0755 nono /usr/local/bin/nono
          rm -f "$tarball" SHA256SUMS.txt nono
          nono --version
      - name: Sign instruction files (keyless, one bundle per file)
        run: |
          for f in AGENTS.md CLAUDE.md .goosehints .mcp.json; do
            if [ -f "$f" ]; then nono trust sign "$f" --keyless; fi
          done
      - name: Commit bundles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- *.bundle .*.bundle 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Sign agent instruction files ($GITHUB_SHA)"
          git push
